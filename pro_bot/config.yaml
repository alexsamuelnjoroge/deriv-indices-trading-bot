# pro_bot configuration — v5 backtested MTF configs
# Symbols use MT5 format: XAUUSD, EURUSD, USDJPY (IC Markets naming)
# Each symbol has its own tuned parameters from the v5 sweep.

strategies:

  # ── Gold (XAUUSD) ─────────────────────────────────────────────────────────
  # Train: EV +0.280R | WR 51.2% [CI 42.5%-59.9%] | 1.2 trades/day | 123 trades
  # Macro EMA20 dynamically switches direction with daily trend
  - name: mtf_pullback
    enabled: true
    symbols: [XAUUSD]
    htf_granularity: 3600      # 1h bars for trend EMA
    ltf_granularity: 300       # 5min bars for entry
    ema_period: 100
    slope_bars: 3
    rsi_period: 14
    rsi_entry: 35.0
    tp_rr: 1.5
    adx_min: 25
    session_peak: true         # London 10:00-13:30 EAT + NY 16:00-19:30 EAT
    tz_offset_hours: 3         # EAT = UTC+3
    macro_filter: true
    macro_ema_period: 20

  # ── EUR/USD (EURUSD) ──────────────────────────────────────────────────────
  # Train: EV +0.388R | WR 46.3% [CI 39.9%-52.8%] | 2.2 trades/day | 227 trades
  # Best overall EV of the 3 symbols
  - name: mtf_pullback
    enabled: true
    symbols: [EURUSD]
    htf_granularity: 3600
    ltf_granularity: 300
    ema_period: 200
    slope_bars: 3
    rsi_period: 14
    rsi_entry: 35.0
    tp_rr: 2.0
    adx_min: 25
    macro_filter: true
    macro_ema_period: 50

  # ── USD/JPY (USDJPY) ──────────────────────────────────────────────────────
  # Train: EV +0.305R | WR 43.5% [CI 37.9%-49.3%] | 2.8 trades/day | 285 trades
  # ATR-based SL adapts to JPY volatility spikes
  - name: mtf_pullback
    enabled: true
    symbols: [USDJPY]
    htf_granularity: 3600
    ltf_granularity: 300
    ema_period: 100
    slope_bars: 3
    rsi_period: 14
    rsi_entry: 35.0
    tp_rr: 2.0
    adx_min: 20
    atr_mult_sl: 1.5           # SL = ATR(14) * 1.5 — adapts to volatility
    macro_filter: true
    macro_ema_period: 20

risk:
  max_risk_per_trade_pct: 1.0    # % of account per trade
  max_daily_loss_pct: 5.0        # halt trading if daily drawdown exceeds this
  max_open_trades: 3             # max base entries (pyramids are additional)
  use_atr_sizing: true           # size position by ATR distance to SL

  # Spread filter: skip entry if spread > ratio × SL distance (0 = off)
  max_spread_sl_ratio: 0.4

  # Break-even: move SL to entry once trade reaches this many R profit (0 = off)
  break_even_trigger_r: 1.0

  # Pyramid: open a scaled entry once trade reaches this many R profit (0 = off)
  pyramid_trigger_r: 1.0
  pyramid_risk_pct: 0.5          # risk % of balance for the pyramid position

  # Cooldown: block re-entry on a symbol for this many seconds after a SL hit (0 = off)
  loss_cooldown_secs: 600        # 10 minutes = 2 full 5-min bars
