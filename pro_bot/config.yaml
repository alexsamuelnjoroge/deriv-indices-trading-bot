# pro_bot configuration — multi-strategy, backtested on 365 days + holdout validation
# Each symbol uses the strategy that generalised best to unseen data.

strategies:

  # ── Gold (XAUUSD) ─────────────────────────────────────────────────────────
  # Strategy : MTF RSI-Pullback (adaptive threshold + 4H EMA quality filter)
  # Backtest : Train EV +0.150R WR 40.4% | Holdout EV +0.349R WR 51.9% n=43
  # 4H filter: requires 4H EMA slope to agree with 1H — cuts noise entries by 20%
  - name: mtf_pullback
    enabled: true
    symbols: [XAUUSD]
    htf_granularity: 3600      # 1h bars for trend EMA
    ltf_granularity: 300       # 5min bars for entry
    ema_period: 200
    slope_bars: 3
    rsi_period: 14
    rsi_entry: 35.0
    rsi_adaptive: true         # 20th-pct of last 50 RSI values — self-calibrates
    rsi_lookback: 50
    tp_rr: 2.0
    adx_min: 0
    atr_mult_sl: 1.5
    use_4h_filter: true        # 4H EMA must agree with 1H trend before entry
    ema_4h_period: 20          # 20-bar EMA on the 4H chart
    session_peak: true         # London 10:00-13:30 EAT + NY 16:00-19:30 EAT
    tz_offset_hours: 3         # EAT = UTC+3
    macro_filter: true
    macro_ema_period: 20

  # ── EUR/USD (EURUSD) ──────────────────────────────────────────────────────
  # Strategy : Bollinger Band + RSI<55 Pullback (new — replaces RSI-pullback)
  # Backtest : Train EV +0.299R WR 55.0% n=441 | Holdout EV +0.186R WR 49.3% n=86
  # Why BB+RSI: RSI-pullback generated 0 trades in holdout; BB+RSI catches shallow
  #             pullbacks to the lower band that RSI<35 would miss entirely.
  - name: bb_rsi_pullback
    enabled: true
    symbols: [EURUSD]
    htf_granularity: 3600
    ltf_granularity: 300
    ema_period: 100
    slope_bars: 3
    bb_period: 20
    bb_std: 2.0
    rsi_period: 14
    rsi_thresh: 55.0           # BUY when RSI < 55 (relaxed vs 35 — catches more pullbacks)
    tp_rr: 1.5
    atr_mult_sl: 1.5
    session_peak: true         # London 10:00-13:30 EAT + NY 16:00-19:30 EAT
    tz_offset_hours: 3         # EAT = UTC+3
    macro_filter: true
    macro_ema_period: 20

  # ── USD/JPY (USDJPY) ──────────────────────────────────────────────────────
  # Strategy : MTF RSI-Pullback (fixed threshold)
  # Backtest : Train EV +0.047R WR 42.2% n=352 | Holdout EV +0.033R WR 41.7% n=30
  # Key changes vs previous: EMA200 (was 100), ADX 25 (was 20), RR 1.5 (was 2.0)
  - name: mtf_pullback
    enabled: true
    symbols: [USDJPY]
    htf_granularity: 3600
    ltf_granularity: 300
    ema_period: 200
    slope_bars: 3
    rsi_period: 14
    rsi_entry: 35.0
    rsi_adaptive: false        # fixed threshold — adaptive didn't help USDJPY
    tp_rr: 1.5
    adx_min: 25
    atr_mult_sl: 1.5
    macro_filter: true
    macro_ema_period: 20

risk:
  max_risk_per_trade_pct: 1.0    # % of account per trade
  max_daily_loss_pct: 5.0        # halt trading if daily drawdown exceeds this
  max_open_trades: 3             # max base entries (pyramids are additional)
  use_atr_sizing: true           # size position by ATR distance to SL

  # Spread filter: skip entry if spread > ratio × SL distance (0 = off)
  max_spread_sl_ratio: 0.4

  # Break-even: move SL to entry once trade reaches this many R profit (0 = off)
  break_even_trigger_r: 1.0

  # Pyramid: open a scaled entry once trade reaches this many R profit (0 = off)
  pyramid_trigger_r: 1.0
  pyramid_risk_pct: 0.5          # risk % of balance for the pyramid position

  # Cooldown: block re-entry on a symbol for this many seconds after a SL hit (0 = off)
  loss_cooldown_secs: 600        # 10 minutes = 2 full 5-min bars
