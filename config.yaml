strategy:
  name: rsi_reversal

  # ── Core RSI ─────────────────────────────────────────────────
  # Validated on 43,000 ticks across 5 independent windows.
  # 5/5 windows profitable, avg WR 62.2%, worst window 56.2%.
  rsi_period: 10
  rsi_overbought: 80
  rsi_oversold: 20
  contract_duration: 10
  contract_duration_unit: t

  bar_size: 1           # 1 = raw ticks (no aggregation); sweep confirmed bar>1 hurts signal count
  confirm_ticks: 2

  # RSI-depth duration: disabled — Deriv caps tick contracts at 10 ticks max.
  # Sweep showed improvement (MinWR +6.2%) but API rejects >10 ticks (ContractBuyValidationError).
  rsi_extreme_threshold: 0
  rsi_extreme_duration: 10

  rsi_slope_confirm: false
  price_confirm: false
  dual_rsi_period: 0
  dual_rsi_threshold: 45

  loss_cooldown: 3

  ema_trend_period: 0
  use_bb_filter: false
  bb_period: 20
  bb_std_dev: 2.0

  use_atr_filter: false
  atr_filter_ratio: 1.2

  atr_period: 14
  atr_baseline_period: 50

risk:
  # ── Stake sizing ──────────────────────────────────────────────
  stake_percent: 2.0        # fallback % when not enough trades for Kelly
  max_stake: 0.35           # minimum stake — validation mode until edge confirmed

  # ── Kelly Criterion ───────────────────────────────────────────
  # Computes optimal stake fraction from live win rate once enough data.
  # Kelly formula: f* = (p*b - q) / b  →  stake = balance * f* * kelly_fraction
  use_kelly: true
  kelly_fraction: 0.5       # half-Kelly for safety (full Kelly is too aggressive)
  kelly_min_trades: 50      # trades before Kelly activates (~2-3 days of live data across 2 symbols)
  payout_pct: 0.9232        # verified 23 Jun 2026: R_25 10-tick Rise/Fall = $192.32 on $100

  # ── Circuit breakers ──────────────────────────────────────────
  daily_loss_limit: 10.0    # halt if daily loss > 10% of balance (resets at midnight)
  max_open_contracts: 1

  # ── Rolling performance monitor ───────────────────────────────
  # Halts if win rate over the last N trades drops below threshold.
  # Guards against market regime changes that the backtest didn't see.
  rolling_window: 30        # number of recent trades to track
  min_rolling_wr: 48.0      # halt if rolling WR drops below 48%

  # ── Time filter (VPS clock = EAT, UTC+3) ─────────────────────
  # Block trading during hours with consistently poor live WR.
  # Based on 278 live trades — only hours with WR < 40% and >= 10 trades blocked.
  # 10:00=25%(20t) 13:00=30%(10t) 19:00=31%(13t) 20:00=38%(21t) 22:00=30%(10t) 23:00=33%(9t)
  blocked_hours_eat: [10, 13, 19, 20, 22, 23]

  # ── Paper trade recovery (all halts) ─────────────────────────
  # While halted the bot tracks simulated signal outcomes.
  # If paper WR recovers above paper_resume_wr over enough signals,
  # the halt clears early — applies to both rolling-WR and daily-loss halts.
  paper_resume_min_trades: 5   # signals needed before evaluating resumption
  paper_resume_wr: 60.0        # paper WR % required to resume

  # ── ATR-adaptive stake ────────────────────────────────────────
  use_atr_stake: true       # scale stake down when volatility spikes

monitoring:
  log_every_tick: false
  dashboard_refresh: 1.0

# ── Telegram alerts ───────────────────────────────────────────────
# Set enabled: true then add to .env:
#   TELEGRAM_BOT_TOKEN=<from @BotFather>
#   TELEGRAM_CHAT_ID=<your chat id>
telegram:
  enabled: false
  on_trade: true            # alert on every trade result
  on_daily_summary: true    # alert once per day at midnight
  on_halt: true             # alert when circuit breaker fires

# ── Multi-symbol trading ──────────────────────────────────────────
# Add symbols here to trade them simultaneously.
# Each symbol can override any strategy param — if not specified, uses
# the 'strategy' section above as the default.
# WARNING: Only R_25 params have been validated. Run sweep_multi.py on
# each new symbol before enabling it in live trading.
symbols:
  - symbol: R_25
    enabled: true
    # no overrides — uses strategy defaults above

  # ── Silver Multiplier bot ─────────────────────────────────────────────
  # Walk-forward validated: 3/3 folds PASS, mean EV +0.053.
  # Same EMA/RSI params as Gold (correlated safe-haven trend).
  # Wider SL/TP because Silver is more volatile per bar than Gold.
  # WR ~28% but TP=3x SL so EV is positive (BE WR = 26%).
  - symbol: frxXAGUSD
    enabled: true
    strategy_type: gold_trend

    ema_period: 200
    slope_bars: 5
    rsi_period: 7
    rsi_entry: 45.0
    bar_seconds: 3600

    multiplier: 100
    sl_pct: 0.005          # 0.50% — Silver needs wider SL than Gold
    tp_pct: 0.015          # 1.50% — 3:1 R:R; BE WR = 26%
    contract_duration: 0
    contract_duration_unit: m

    min_stake: 1.0
    max_stake: 1.0
    stake_percent: 1.0
    use_kelly: false

  # ── Gold Multiplier bot ───────────────────────────────────────────────
  # Strategy validated on frxXAUUSD 1h bars (walk-forward 3/3 folds, p=0.028).
  # Run in demo for 2-4 weeks before enabling live.
  - symbol: frxXAUUSD
    enabled: true
    strategy_type: gold_trend

    # EMA trend filter + RSI pullback (validated params)
    ema_period: 200
    slope_bars: 5
    rsi_period: 7
    rsi_entry: 45.0        # BUY_RISE when RSI < 45; BUY_FALL when RSI > 55
    bar_seconds: 3600      # 1-hour bars

    # Multiplier contract params
    multiplier: 100
    sl_pct: 0.003          # 0.30% price move → SL hit
    tp_pct: 0.0075         # 0.75% price move → TP hit
    contract_duration: 0   # placeholder (not used for multipliers)
    contract_duration_unit: m

    # Risk overrides: multipliers need min $1 stake; start conservative
    min_stake: 1.0
    max_stake: 1.0         # fixed $1 demo stake (raise to 2% of balance when validated)
    stake_percent: 1.0
    use_kelly: false       # no Kelly until we have live win rate data

  - symbol: R_50
    enabled: false          # sweep showed WG=4/5, best result only 44 trades — too small to trust
    rsi_period: 10
    rsi_overbought: 80
    rsi_oversold: 20
    contract_duration: 10
    confirm_ticks: 2

  - symbol: R_75
    enabled: false          # disabled 2026-07-13: 245 live trades, 48.2% WR — below breakeven
    # Params validated on 43,196 ticks across 5 independent windows
    # Per-window WRs: 60.9 / 75.0 / 56.0 / 63.2 / 60.9
    # Sweep 2026-06-26: tightened atr_filter_ratio 1.2 -> 1.0 (top result: MinWR 61.5% vs 56.0%)
    rsi_period: 10
    rsi_overbought: 80
    rsi_oversold: 20
    contract_duration: 10
    contract_duration_unit: t
    confirm_ticks: 2
    use_atr_filter: true    # R_75 is more volatile — ATR filter prevents trending-burst losses
    atr_filter_ratio: 1.0   # tightened from 1.2: only trade at normal/below-normal volatility
    loss_cooldown: 2

  - symbol: R_100
    enabled: false          # sweep showed WG=4/5, MinWR 50.0% (below breakeven) — too risky
    rsi_period: 7
    rsi_overbought: 80
    rsi_oversold: 20
    contract_duration: 10
    confirm_ticks: 2
    use_atr_filter: true
    atr_filter_ratio: 1.0
