strategy:
  name: rsi_reversal

  # ── Core RSI ─────────────────────────────────────────────────
  # Validated on 43,000 ticks across 5 independent windows.
  # 5/5 windows profitable, avg WR 62.2%, worst window 56.2%.
  rsi_period: 10
  rsi_overbought: 80
  rsi_oversold: 20
  contract_duration: 10
  contract_duration_unit: t

  bar_size: 1           # 1 = raw ticks (no aggregation); sweep confirmed bar>1 hurts signal count
  confirm_ticks: 2

  # RSI-depth duration: disabled — Deriv caps tick contracts at 10 ticks max.
  # Sweep showed improvement (MinWR +6.2%) but API rejects >10 ticks (ContractBuyValidationError).
  rsi_extreme_threshold: 0
  rsi_extreme_duration: 10

  rsi_slope_confirm: false
  price_confirm: false
  dual_rsi_period: 0
  dual_rsi_threshold: 45

  loss_cooldown: 3

  ema_trend_period: 0
  use_bb_filter: false
  bb_period: 20
  bb_std_dev: 2.0

  use_atr_filter: false
  atr_filter_ratio: 1.2

  atr_period: 14
  atr_baseline_period: 50

risk:
  # ── Stake sizing ──────────────────────────────────────────────
  stake_percent: 2.0        # fallback % when not enough trades for Kelly
  max_stake: 0.35           # minimum stake — validation mode until edge confirmed

  # ── Kelly Criterion ───────────────────────────────────────────
  # Computes optimal stake fraction from live win rate once enough data.
  # Kelly formula: f* = (p*b - q) / b  →  stake = balance * f* * kelly_fraction
  use_kelly: true
  kelly_fraction: 0.5       # half-Kelly for safety (full Kelly is too aggressive)
  kelly_min_trades: 50      # trades before Kelly activates (~2-3 days of live data across 2 symbols)
  payout_pct: 0.9232        # verified 23 Jun 2026: R_25 10-tick Rise/Fall = $192.32 on $100

  # ── Circuit breakers ──────────────────────────────────────────
  daily_loss_limit: 10.0    # halt if daily loss > 10% of balance (resets at midnight)
  max_open_contracts: 1

  # ── Rolling performance monitor ───────────────────────────────
  # Halts if win rate over the last N trades drops below threshold.
  # Guards against market regime changes that the backtest didn't see.
  rolling_window: 30        # number of recent trades to track
  min_rolling_wr: 48.0      # halt if rolling WR drops below 48%

  # ── Time filter (VPS clock = EAT, UTC+3) ─────────────────────
  # Block trading during hours with consistently poor live WR.
  # Based on 278 live trades — only hours with WR < 40% and >= 10 trades blocked.
  # 10:00=25%(20t) 13:00=30%(10t) 19:00=31%(13t) 20:00=38%(21t) 22:00=30%(10t) 23:00=33%(9t)
  blocked_hours_eat: [10, 13, 19, 20, 22, 23]

  # ── Paper trade recovery (all halts) ─────────────────────────
  # While halted the bot tracks simulated signal outcomes.
  # If paper WR recovers above paper_resume_wr over enough signals,
  # the halt clears early — applies to both rolling-WR and daily-loss halts.
  paper_resume_min_trades: 5   # signals needed before evaluating resumption
  paper_resume_wr: 60.0        # paper WR % required to resume

  # ── ATR-adaptive stake ────────────────────────────────────────
  use_atr_stake: true       # scale stake down when volatility spikes

monitoring:
  log_every_tick: false
  dashboard_refresh: 1.0

# ── Telegram alerts ───────────────────────────────────────────────
# Set enabled: true then add to .env:
#   TELEGRAM_BOT_TOKEN=<from @BotFather>
#   TELEGRAM_CHAT_ID=<your chat id>
telegram:
  enabled: false
  on_trade: true            # alert on every trade result
  on_daily_summary: true    # alert once per day at midnight
  on_halt: true             # alert when circuit breaker fires

# ── Multi-symbol trading ──────────────────────────────────────────
# Add symbols here to trade them simultaneously.
# Each symbol can override any strategy param — if not specified, uses
# the 'strategy' section above as the default.
# WARNING: Only R_25 params have been validated. Run sweep_multi.py on
# each new symbol before enabling it in live trading.
symbols:
  - symbol: R_25
    enabled: true
    # no overrides — uses strategy defaults above

  # ── Silver Multiplier bot ─────────────────────────────────────────────
  # Walk-forward validated: 3/3 folds PASS, mean EV +0.431 (upgraded from +0.053).
  # Tighter RSI(14)<35 entry selects only deep pullbacks — WR 42-70% vs 27-29% before.
  # BE WR = 40.8%; all 3 folds comfortably above it.
  - symbol: frxXAGUSD
    enabled: true
    strategy_type: gold_trend

    ema_period: 200
    slope_bars: 5
    rsi_period: 14          # RSI(14) — slower, filters noise better than RSI(7)
    rsi_entry: 35.0         # only enter on deep pullbacks (RSI<35 or RSI>65)
    bar_seconds: 3600

    multiplier: 100
    sl_pct: 0.01            # 1.00% SL
    tp_pct: 0.015           # 1.50% TP — 1.5:1 R:R; BE WR = 40.8%
    contract_duration: 0
    contract_duration_unit: m

    min_stake: 1.0
    max_stake: 1.0
    stake_percent: 1.0
    use_kelly: false

  # ── Gold Multiplier bot ───────────────────────────────────────────────
  # Strategy validated on frxXAUUSD 1h bars (walk-forward 3/3 folds, p=0.028).
  # Run in demo for 2-4 weeks before enabling live.
  - symbol: frxXAUUSD
    enabled: true
    strategy_type: gold_trend

    # EMA trend filter + RSI pullback (validated params)
    ema_period: 200
    slope_bars: 5
    rsi_period: 7
    rsi_entry: 45.0        # BUY_RISE when RSI < 45; BUY_FALL when RSI > 55
    bar_seconds: 3600      # 1-hour bars

    # Multiplier contract params
    multiplier: 100
    sl_pct: 0.003          # 0.30% price move → SL hit
    tp_pct: 0.0075         # 0.75% price move → TP hit
    contract_duration: 0   # placeholder (not used for multipliers)
    contract_duration_unit: m

    # Risk overrides: multipliers need min $1 stake; start conservative
    min_stake: 1.0
    max_stake: 1.0         # fixed $1 demo stake (raise to 2% of balance when validated)
    stake_percent: 1.0
    use_kelly: false       # no Kelly until we have live win rate data
    max_open_contracts: 2

  # ── Gold MACD backup ─────────────────────────────────────────────────
  # Walk-forward 3/3, mean EV +0.497 — strongest single strategy tested.
  # Overlap test: max_open=2 maintains 3/3 and grows total profit.
  - symbol: frxXAUUSD
    enabled: true
    strategy_type: macd_trend
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    bar_seconds: 3600
    multiplier: 100
    sl_pct: 0.0075          # 0.75% SL
    tp_pct: 0.020           # 2.00% TP | BE WR = 28.0%
    min_stake: 1.0
    max_stake: 1.0
    stake_percent: 1.0
    use_kelly: false
    max_open_contracts: 2

  # ── Gold Donchian backup ──────────────────────────────────────────────
  # Walk-forward 3/3, mean EV +0.308 — high trade frequency (150-395/period).
  # max_open=2: EV stable at +0.124, total profit +32 vs +21.
  - symbol: frxXAUUSD
    enabled: true
    strategy_type: donchian
    donchian_period: 30
    bar_seconds: 3600
    multiplier: 100
    sl_pct: 0.010           # 1.00% SL
    tp_pct: 0.020           # 2.00% TP | BE WR = 34.0%
    min_stake: 1.0
    max_stake: 1.0
    stake_percent: 1.0
    use_kelly: false
    max_open_contracts: 2

  # ── Silver BB Squeeze backup ──────────────────────────────────────────
  # Walk-forward 3/3, mean EV +0.360 — best Silver backup.
  # Keep max_open=1: overlap test showed EV drops from +0.48 to +0.38 at max=2.
  - symbol: frxXAGUSD
    enabled: true
    strategy_type: bb_squeeze
    bb_period: 50
    bb_std: 1.5
    squeeze_pct: 30
    bar_seconds: 3600
    multiplier: 100
    sl_pct: 0.010           # 1.00% SL
    tp_pct: 0.020           # 2.00% TP | BE WR = 34.0%
    min_stake: 1.0
    max_stake: 1.0
    stake_percent: 1.0
    use_kelly: false
    max_open_contracts: 1

  # ── Silver MACD backup ────────────────────────────────────────────────
  # Walk-forward 3/3, mean EV +0.316.
  - symbol: frxXAGUSD
    enabled: true
    strategy_type: macd_trend
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    bar_seconds: 3600
    multiplier: 100
    sl_pct: 0.010           # 1.00% SL
    tp_pct: 0.020           # 2.00% TP | BE WR = 34.0%
    min_stake: 1.0
    max_stake: 1.0
    stake_percent: 1.0
    use_kelly: false
    max_open_contracts: 1

  # ── GBP/USD EMA Cross ────────────────────────────────────────────────
  # Walk-forward 3/3, mean EV +0.329. Keep max_open=1 (overlap destroys edge).
  - symbol: frxGBPUSD
    enabled: true
    strategy_type: ema_cross
    ema_fast: 20
    ema_slow: 50
    bar_seconds: 3600
    multiplier: 100
    sl_pct: 0.0075          # 0.75% SL
    tp_pct: 0.020           # 2.00% TP | BE WR = 28.0%
    contract_duration: 0
    contract_duration_unit: m
    min_stake: 1.0
    max_stake: 1.0
    stake_percent: 1.0
    use_kelly: false
    max_open_contracts: 1

  # ── GBP/USD MACD ─────────────────────────────────────────────────────
  # Walk-forward 3/3, mean EV +0.213.
  - symbol: frxGBPUSD
    enabled: true
    strategy_type: macd_trend
    macd_fast: 5
    macd_slow: 13
    macd_signal: 5
    bar_seconds: 3600
    multiplier: 100
    sl_pct: 0.0075          # 0.75% SL
    tp_pct: 0.010           # 1.00% TP | BE WR = 44.0%
    contract_duration: 0
    contract_duration_unit: m
    min_stake: 1.0
    max_stake: 1.0
    stake_percent: 1.0
    use_kelly: false
    max_open_contracts: 1

  # ── Gold 15-min EMA Cross ────────────────────────────────────────────────
  # Walk-forward 3/3, MeanEV +0.1498. Lower timeframe = more crossovers than 1h.
  - symbol: frxXAUUSD
    enabled: true
    strategy_type: ema_cross
    ema_fast: 20
    ema_slow: 50
    bar_seconds: 900
    multiplier: 100
    sl_pct: 0.005           # 0.50% SL
    tp_pct: 0.015           # 1.50% TP | BE WR 26.7%
    min_stake: 1.0
    max_stake: 1.0
    stake_percent: 1.0
    use_kelly: false
    max_open_contracts: 1

  # ── Silver 15-min EMA Cross ───────────────────────────────────────────────
  # Walk-forward 3/3, MeanEV +0.7527. Best mean EV of all research results.
  - symbol: frxXAGUSD
    enabled: true
    strategy_type: ema_cross
    ema_fast: 20
    ema_slow: 50
    bar_seconds: 900
    multiplier: 100
    sl_pct: 0.015           # 1.50% SL
    tp_pct: 0.025           # 2.50% TP | BE WR 38.5%
    min_stake: 1.0
    max_stake: 1.0
    stake_percent: 1.0
    use_kelly: false
    max_open_contracts: 1

  # ── Gold 15-min RSI+EMA Filter ────────────────────────────────────────────
  # Walk-forward 3/3, MeanEV +0.4111. EMA(50) slope filters RSI(14)<40 pullbacks.
  - symbol: frxXAUUSD
    enabled: true
    strategy_type: gold_trend
    ema_period: 50
    slope_bars: 3
    rsi_period: 14
    rsi_entry: 40.0
    bar_seconds: 900
    multiplier: 100
    sl_pct: 0.003           # 0.30% SL
    tp_pct: 0.025           # 2.50% TP | BE WR 11.2%
    min_stake: 1.0
    max_stake: 1.0
    stake_percent: 1.0
    use_kelly: false
    max_open_contracts: 1

  # ── Silver 5-min RSI Mean Reversion ──────────────────────────────────────
  # Walk-forward 3/3, MeanEV +0.1093. ~3 trades/day — highest frequency financial strategy.
  - symbol: frxXAGUSD
    enabled: true
    strategy_type: rsi_multiplier
    rsi_period: 14
    rsi_os: 30.0
    rsi_ob: 70.0
    bar_seconds: 300
    multiplier: 100
    sl_pct: 0.005           # 0.50% SL
    tp_pct: 0.010           # 1.00% TP | MeanEV +0.1093
    min_stake: 1.0
    max_stake: 1.0
    stake_percent: 1.0
    use_kelly: false
    max_open_contracts: 1

  # ── Vol 10 (1s) RSI Binary ───────────────────────────────────────────────
  # Walk-forward 3/3, MeanEV +0.1822. WRs: 65.8/62.5/68.8% (~2.1 trades/day)
  # BE WR = 55.6% @80% payout — verify actual payout in live API before scaling.
  - symbol: 1HZ10V
    enabled: true
    strategy_type: rsi_binary
    rsi_period: 14
    rsi_os: 30.0
    rsi_ob: 70.0
    bar_seconds: 300
    contract_duration: 10
    contract_duration_unit: m
    multiplier: 0
    min_stake: 1.0
    max_stake: 1.0
    stake_percent: 1.0
    use_kelly: false
    payout_pct: 0.80
    max_open_contracts: 1

  # ── Jump 10 RSI Binary ────────────────────────────────────────────────────
  # Walk-forward 3/3, MeanEV +0.0926. WRs: 61.9/59.1/61.1% (~1.2 trades/day)
  - symbol: JD10
    enabled: true
    strategy_type: rsi_binary
    rsi_period: 14
    rsi_os: 25.0
    rsi_ob: 75.0
    bar_seconds: 300
    contract_duration: 10
    contract_duration_unit: m
    multiplier: 0
    min_stake: 1.0
    max_stake: 1.0
    stake_percent: 1.0
    use_kelly: false
    payout_pct: 0.80
    max_open_contracts: 1

  - symbol: R_50
    enabled: false          # sweep showed WG=4/5, best result only 44 trades — too small to trust
    rsi_period: 10
    rsi_overbought: 80
    rsi_oversold: 20
    contract_duration: 10
    confirm_ticks: 2

  - symbol: R_75
    enabled: false          # disabled 2026-07-13: 245 live trades, 48.2% WR — below breakeven
    # Params validated on 43,196 ticks across 5 independent windows
    # Per-window WRs: 60.9 / 75.0 / 56.0 / 63.2 / 60.9
    # Sweep 2026-06-26: tightened atr_filter_ratio 1.2 -> 1.0 (top result: MinWR 61.5% vs 56.0%)
    rsi_period: 10
    rsi_overbought: 80
    rsi_oversold: 20
    contract_duration: 10
    contract_duration_unit: t
    confirm_ticks: 2
    use_atr_filter: true    # R_75 is more volatile — ATR filter prevents trending-burst losses
    atr_filter_ratio: 1.0   # tightened from 1.2: only trade at normal/below-normal volatility
    loss_cooldown: 2

  - symbol: R_100
    enabled: false          # sweep showed WG=4/5, MinWR 50.0% (below breakeven) — too risky
    rsi_period: 7
    rsi_overbought: 80
    rsi_oversold: 20
    contract_duration: 10
    confirm_ticks: 2
    use_atr_filter: true
    atr_filter_ratio: 1.0
