  # After hold_ticks, the bot auto-sells for accumulated profit.
  # Accumulators are direction-agnostic: after a spike the recoil ticks are
  # small enough to stay within the barrier, so ACCU grows tick by tick.
  # growth_rate: check available rates on your account (1%-5% per tick).
  # Synthetics are 24/7 — blocked_hours_eat: [] disables the time filter.
  # Backtest verdict (4-window walk-forward, real barrier from Deriv API):
  # confirm_threshold=1.0 (size-only gate, no direction check — ACCU is direction-agnostic)
