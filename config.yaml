  # Signal: close was outside 2.5σ BB last bar, re-enters inside this bar.
  # Low frequency (~0.4 trades/day) — high conviction only.
  - symbol: frxXAUUSD
    enabled: true
    strategy_type: bb_binary
    bb_period: 10
    bb_std: 2.5
    bb_mode: reenter
    bar_seconds: 300
    contract_duration: 10
